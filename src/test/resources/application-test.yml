spring:
  datasource:
    url: jdbc:h2:mem:lottory-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

app:
  messaging:
    lottery:
      outbox-poll-interval-ms: 3600000
