spring.application.name=yuzhi
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yuzhi}
spring.datasource.username=${DB_USERNAME:yuzhi}
spring.datasource.password=${DB_PASSWORD:yuzhi}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# RabbitMQ
spring.rabbitmq.host=${MQ_HOST:localhost}
spring.rabbitmq.port=${MQ_PORT:5672}
spring.rabbitmq.username=${MQ_USERNAME:guest}
spring.rabbitmq.password=${MQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${MQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=${MQ_PREFETCH:20}
spring.rabbitmq.listener.simple.concurrency=${MQ_CONCURRENCY:3}
spring.rabbitmq.listener.simple.max-concurrency=${MQ_MAX_CONCURRENCY:10}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${MQ_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=${MQ_RETRY_INITIAL_INTERVAL:1s}

app.messaging.lottery.exchange=${LOTTERY_EXCHANGE:lottery.exchange}
app.messaging.lottery.queue=${LOTTERY_QUEUE:lottery.draw.queue}
app.messaging.lottery.routing-key=${LOTTERY_ROUTING_KEY:lottery.draw.requested}
app.messaging.lottery.dead-letter-exchange=${LOTTERY_DLX:lottery.dlx}
app.messaging.lottery.dead-letter-queue=${LOTTERY_DLQ:lottery.draw.dlq}
app.messaging.lottery.dead-letter-routing-key=${LOTTERY_DLQ_ROUTING_KEY:lottery.draw.dead}
app.messaging.lottery.outbox-poll-interval-ms=${LOTTERY_OUTBOX_POLL_INTERVAL_MS:1000}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.timeout=${REDIS_COMMAND_TIMEOUT:2s}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_POOL_MAX_ACTIVE:32}
spring.data.redis.lettuce.pool.max-idle=${REDIS_POOL_MAX_IDLE:16}
spring.data.redis.lettuce.pool.min-idle=${REDIS_POOL_MIN_IDLE:4}
spring.data.redis.lettuce.pool.max-wait=${REDIS_POOL_MAX_WAIT:2s}

app.database.transaction-timeout-seconds=${DB_TRANSACTION_TIMEOUT_SECONDS:10}
