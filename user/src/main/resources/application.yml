server:
  port: ${USER_SERVER_PORT:8082}
  http2:
    enabled: ${HTTP2_ENABLED:true}

spring:
  application:
    name: user
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/lottery}"
    username: "${DB_USERNAME:lottery}"
    password: "${DB_PASSWORD:lottery}"
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/lottery}"
          audiences: "${USER_KEYCLOAK_AUDIENCE:user-service}"
      client:
        provider:
          keycloak:
            issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/lottery}"
        registration:
          keycloak-backend:
            provider: keycloak
            client-id: "${USER_KEYCLOAK_CLIENT_ID:user-service}"
            client-secret: "${USER_KEYCLOAK_CLIENT_SECRET:change-me}"
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: openid

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    enabled: ${SWAGGER_API_DOCS_ENABLED:true}
    path: /swagger/v1/user/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger/v1/user
    persist-authorization: true
    oauth:
      client-id: "${USER_SWAGGER_CLIENT_ID:user-service}"
      use-basic-authentication-with-access-code-grant: true

app:
  openapi:
    title: "${USER_OPENAPI_TITLE:User Service API}"
    version: "${USER_OPENAPI_VERSION:v1}"
    oauth2:
      token-url: "${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/lottery/protocol/openid-connect/token}"
      scopes:
        openid: Access the authenticated client identity
  keycloak:
    backend:
      registration-id: keycloak-backend
      client-id: "${USER_KEYCLOAK_CLIENT_ID:user-service}"
      admin-base-uri: "${KEYCLOAK_ADMIN_BASE_URI:http://localhost:8081/admin/realms/lottery}"
    frontend:
      client-id: "${FRONTEND_KEYCLOAK_CLIENT_ID:lottery-web}"
      authorization-uri: "${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8081/realms/lottery/protocol/openid-connect/auth}"
      token-uri: "${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/lottery/protocol/openid-connect/token}"
      redirect-uri: "${KEYCLOAK_FRONTEND_REDIRECT_URI:http://localhost:3000/callback}"
      scopes: "openid,profile,email"
      pkce-method: S256
