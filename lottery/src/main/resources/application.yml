server:
  port: ${LOTTERY_SERVER_PORT:8080}
  http2:
    enabled: ${HTTP2_ENABLED:true}

spring:
  application:
    name: lottery
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/lottery}"
    username: "${DB_USERNAME:lottery}"
    password: "${DB_PASSWORD:lottery}"
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/lottery}"
          audiences: "${LOTTERY_KEYCLOAK_AUDIENCE:lottery-service}"
  rabbitmq:
    host: "${MQ_HOST:localhost}"
    port: ${MQ_PORT:5672}
    username: "${MQ_USERNAME:guest}"
    password: "${MQ_PASSWORD:guest}"
    virtual-host: "${MQ_VHOST:/}"
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: ${MQ_PREFETCH:20}
        concurrency: ${MQ_CONCURRENCY:3}
        max-concurrency: ${MQ_MAX_CONCURRENCY:10}
        retry:
          enabled: true
          initial-interval: "${MQ_RETRY_INITIAL_INTERVAL:1s}"
          max-retries: ${MQ_RETRY_MAX_ATTEMPTS:3}
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: ${REDIS_PORT:6379}
      username: "${REDIS_USERNAME:}"
      password: "${REDIS_PASSWORD:}"
      database: ${REDIS_DATABASE:0}
      connect-timeout: "${REDIS_CONNECT_TIMEOUT:2s}"
      timeout: "${REDIS_COMMAND_TIMEOUT:2s}"
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: "${REDIS_POOL_MAX_WAIT:2s}"

springdoc:
  api-docs:
    enabled: ${SWAGGER_API_DOCS_ENABLED:true}
    path: /swagger/v1/lottery/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger/v1/lottery
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    filter: true
    try-it-out-enabled: true
    disable-swagger-default-url: true
    persist-authorization: true
    oauth2-redirect-url: "${SWAGGER_OAUTH2_REDIRECT_URI:http://localhost:8080/swagger/v1/swagger-ui/oauth2-redirect.html}"
    oauth:
      client-id: "${FRONTEND_KEYCLOAK_CLIENT_ID:lottery-web}"
      app-name: Lottery Swagger PKCE
      scopes: openid,profile,email
      use-pkce-with-authorization-code-grant: true
  packages-to-scan: com.interview.lottory.controller
  paths-to-match: /api/**
  show-actuator: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  keycloak:
    client-id: "${LOTTERY_KEYCLOAK_CLIENT_ID:lottery-service}"
  user-service:
    base-url: "${USER_SERVICE_BASE_URL:http://localhost:8082}"
    http2-enabled: ${USER_SERVICE_HTTP2_ENABLED:true}
  swagger:
    oauth2:
      authorization-url: "${KEYCLOAK_AUTHORIZATION_URI:http://localhost:8081/realms/lottery/protocol/openid-connect/auth}"
      token-url: "${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/lottery/protocol/openid-connect/token}"
  database:
    transaction-timeout-seconds: ${DB_TRANSACTION_TIMEOUT_SECONDS:10}
  lottery:
    draw:
      max-batch-draws: ${DRAW_MAX_BATCH_DRAWS:100}
      probability-scale: ${DRAW_PROBABILITY_SCALE:10000000}
      idempotency-ttl: "${DRAW_IDEMPOTENCY_TTL:24h}"
      result-ttl: "${DRAW_RESULT_TTL:24h}"
      stock-reservation-ttl: "${DRAW_STOCK_RESERVATION_TTL:10m}"
      stock-reservation-cleanup-interval: "${DRAW_STOCK_RESERVATION_CLEANUP_INTERVAL:1m}"
      sse-timeout: "${DRAW_SSE_TIMEOUT:5m}"
      sse-poll-interval: "${DRAW_SSE_POLL_INTERVAL:500ms}"
  messaging:
    lottery:
      exchange: "${LOTTERY_EXCHANGE:lottery.exchange}"
      queue: "${LOTTERY_QUEUE:lottery.draw.queue}"
      routing-key: "${LOTTERY_ROUTING_KEY:lottery.draw.requested}"
      dead-letter-exchange: "${LOTTERY_DLX:lottery.dlx}"
      dead-letter-queue: "${LOTTERY_DLQ:lottery.draw.dlq}"
      dead-letter-routing-key: "${LOTTERY_DLQ_ROUTING_KEY:lottery.draw.dead}"
      outbox-poll-interval-ms: ${LOTTERY_OUTBOX_POLL_INTERVAL_MS:1000}
