plugins {
	id 'org.springframework.boot' version '4.0.8' apply false
	id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
	group = 'com.interview'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(26)
		}
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}
